server:
  port: 8080

spring:
  application:
    name: mall-backend
  # 默认使用 H2 内存数据库，clone 后无需安装 MySQL 即可运行；
  # 切换 MySQL 时，取消 pom.xml 中 mysql 依赖注释，并替换下面的 datasource 配置。
  datasource:
    url: jdbc:h2:mem:mall;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# 图片上传目录（相对工作目录）
mall:
  upload-dir: uploads
  # 线上支付配置（挑战 C.1）
  # 默认 enabled=false：四个渠道全部走站内「模拟收银台」，无需任何第三方资质即可演示。
  # 若要对接支付宝沙箱：把 enabled 改为 true，并填入沙箱 APPID / 应用私钥 / 支付宝公钥，
  # notify-url 必须是公网可访问地址（本地可用 natapp / cpolar 等内网穿透）。
  pay:
    alipay:
      enabled: false
      app-id:
      gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
      private-key:
      alipay-public-key:
      notify-url: http://localhost:8080/api/customer/payments/alipay/notify
      return-url: http://localhost:5173/customer/orders
      subject-prefix: 拼嘻嘻订单
